<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <div class="header">
        <h1>ACME Support</h1>
        <div class="nav">
            <a href="/home">Home</a>
            <a href="/help">Help</a>
            <a href="/">Contact</a>
        </div>
    </div>
    <hr>
    <form action="/ContactForm.html" method="post">
        <h1>Contact Us</h1>
        <p> Send us a message and we will get back to you</p>
         <p>
        <label for="Name">Name</label>
        <input id="name" name="Name" type="text" required>
      </p> 
        <p>
        <label for="email">Email </label>
        <input id="email" name="email" type="email" required>
      </p>
      <label for="country">Country</label>
<select id="Topic" name="Topic">
  <option value="">Choose a Topic</option>
  <option value="Language">HTML</option>
  <option value="Framework">Reactjs</option>
  <option value="Backend">php</option>
</select>

<p><label for="Message">Message</label>
<textarea id="message" name="message" rows="4"></textarea>
</p>

<p>
    <fieldset>
  <legend>How did you hear about us?</legend>
  <label><input type="radio" name="place" value="Search"> Search</label><br>
  <label><input type="radio" name="place" value="Friend"> Friend</label><br>
  <label><input type="radio" name="Place" value="Socal Media">Social Media</label>
</fieldset>
</p> 
<p>
    <label>
          <input type="checkbox" name="Social Media" value="yes">
          Send me product updates
        </label>
      </p>
    <button type="submit">Send Message</button>
    </form>
    <hr>
    <p>&copy 2026 Acme Support</p>
</body>
</html>
